name: Deploy API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: api
        run: npm install

      # Repository secrets required (Settings -> Secrets and variables -> Actions):
      #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
      #   TURSO_DB_URL, TURSO_DB_AUTH_TOKEN, BOOTSTRAP_SECRET
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
          secrets: |
            TURSO_DB_URL
            TURSO_DB_AUTH_TOKEN
            BOOTSTRAP_SECRET
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_DB_AUTH_TOKEN: ${{ secrets.TURSO_DB_AUTH_TOKEN }}
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
